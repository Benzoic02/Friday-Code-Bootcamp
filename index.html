<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151515">
    <meta name="description" content="A practical, project-based course for turning ideas into products with Friday Code.">
    <title>Friday Code Bootcamp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Close course navigation" tabindex="-1"></button>
      <aside class="sidebar" id="sidebar" aria-label="Course navigation">
        <a class="brand" href="./index.html" aria-label="Friday Code Bootcamp home">
          <span class="brand-mark"><img id="brand-logo" src="./Friday%20Code%20-%20Icon%20-%20Light.svg" alt=""></span>
          <span class="brand-copy">
            <span class="brand-name">Friday Code</span>
            <span class="brand-subtitle">BOOTCAMP</span>
          </span>
        </a>

        <div class="sidebar-rule"></div>

        <div class="course-label">
          <span class="course-count">10 MODULES</span>
        </div>
        <nav class="lesson-nav" id="lesson-nav" aria-label="Lessons"></nav>

        <div class="sidebar-bottom">
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Hide course navigation" aria-controls="sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m4-10 2 2-2 2"/></svg>
            <span class="sidebar-toggle-label">Hide sidebar</span>
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-leading">
            <button class="icon-button menu-button" id="menu-toggle" aria-label="Open course navigation" aria-controls="sidebar" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
          </div>
          <div class="topbar-actions">
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">
              <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
              <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.6 8.6 0 1 0 20.4 15.1Z"/></svg>
              <span class="theme-label">Light mode</span>
            </button>
          </div>
        </header>

        <div class="reading-progress" aria-hidden="true"><span id="reading-progress-bar"></span></div>

        <div class="content-wrap" id="content-wrap">
          <div class="loading-state" id="loading-state">
            <span class="loading-mark"></span>
            <p>Opening your course...</p>
          </div>
          <article class="lesson-content" id="lesson-content" tabindex="-1"></article>
          <div class="lesson-footer" id="lesson-footer"></div>
        </div>

        <footer class="page-footer">
          <a class="try-friday-link" href="https://www.tryfriday.ai/code?source=course" target="_blank" rel="noopener noreferrer">TRY FRIDAY CODE <span aria-hidden="true">↗</span></a>
        </footer>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
